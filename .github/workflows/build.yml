name: Build DBLegacy Client
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install vcpkg dependencies
      run: |
        cd C:\vcpkg
        .\vcpkg install boost:x86-windows-static openssl:x86-windows-static lua:x86-windows-static physfs:x86-windows-static zlib:x86-windows-static
    - name: Build
      run: |
        cd vc16
        msbuild otclient.sln /p:Configuration=DirectX /p:Platform=Win32
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DBLegacy-exe
        path: otclient_dx.exe
